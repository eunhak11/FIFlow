service: stock-crawler
package:
  individually: true
  patterns:
    - '!node_modules/**'
    - '!venv/**'
    - '!__pycache__/**'
    - '!*.pyc'
    - '!*.bak'
    - '*.py'
plugins:
  - serverless-python-requirements
provider:
  name: aws
  runtime: python3.9
  region: ap-northeast-2
  architecture: x86_64
  deploymentBucket:
    name: fiflowbucket
  environment:
    DYNAMODB_TABLE: fiflow-users
  iam:
    role:
      managedPolicies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
functions:
  mainCrawler:
    handler: lambda_main.main
    timeout: 29
    memorySize: 256
  indexCrawler:
    handler: index_crawler.main
    timeout: 29
    memorySize: 256
    events:
      - http:
          path: trigger-index-crawl
          method: post
          cors: true
  stockInfoCrawler:
    handler: get_stock_info.main
    timeout: 29
    memorySize: 256
  getRealtimePrice:
    handler: get_realtime_price.main
    timeout: 28
    memorySize: 128
    events:
      - http:
          path: realtime-price
          method: get
          cors: true
custom:
  pythonRequirements:
    layer: true
